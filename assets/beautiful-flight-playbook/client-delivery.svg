<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.title{font-weight:700;font-size:26px}.body{font-size:19px}.small{font-size:16px}.white{fill:white}.line{stroke:#718096;stroke-width:4;fill:none}.dash{stroke:#b7791f;stroke-width:4;fill:none;stroke-dasharray:12 10}.navy{fill:#10213f;stroke:#10213f}.blue{fill:#eaf5fb;stroke:#1a3158}.mint{fill:#ddf4f1;stroke:#0f766e}.sand{fill:#f5e8cb;stroke:#b7791f}.paper{fill:#fff;stroke:#0f766e}.box{stroke-width:3;rx:24;ry:24}</style><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#718096"/></marker><marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b7791f"/></marker></defs><rect class="box blue" x="40" y="30" width="500" height="130"/><text class="title" x="290.0" y="72" text-anchor="middle">1. Intake</text><text class="body" x="290.0" y="106" text-anchor="middle">Who are you? What matters now?</text><path class="line" d="M540,95 L650,95" marker-end="url(#arrow)"/><rect class="box sand" x="660" y="30" width="500" height="130"/><text class="title" x="910.0" y="72" text-anchor="middle">2. Boundary</text><text class="body" x="910.0" y="106" text-anchor="middle">No PHI • permissions • scope • what remains human</text><path class="line" d="M910,160 L910,200" marker-end="url(#arrow)"/><rect class="box mint" x="660" y="205" width="500" height="130"/><text class="title" x="910.0" y="247" text-anchor="middle">3. One goal</text><text class="body" x="910.0" y="281" text-anchor="middle">Choose one problem small enough to finish</text><path class="line" d="M660,270 L540,270" marker-end="url(#arrow)"/><rect class="box paper" x="40" y="205" width="500" height="130"/><text class="title" x="290.0" y="247" text-anchor="middle">4. Guided setup</text><text class="body" x="290.0" y="281" text-anchor="middle">Mission Control • context • thinking partner • workflow</text><path class="line" d="M290,335 L290,375" marker-end="url(#arrow)"/><rect class="box navy" x="40" y="380" width="500" height="130"/><text class="title white" x="290.0" y="422" text-anchor="middle">5. First useful artifact</text><text class="body white" x="290.0" y="456" text-anchor="middle">Plan • decision map • dashboard • script • workflow packet</text><path class="line" d="M540,445 L650,445" marker-end="url(#arrow)"/><rect class="box sand" x="660" y="380" width="500" height="130"/><text class="title" x="910.0" y="422" text-anchor="middle">6. Human review</text><text class="body" x="910.0" y="456" text-anchor="middle">Correct • override • verify • document uncertainty</text><path class="line" d="M910,510 L910,550" marker-end="url(#arrow)"/><rect class="box blue" x="660" y="555" width="500" height="130"/><text class="title" x="910.0" y="597" text-anchor="middle">7. Next path</text><text class="body" x="910.0" y="631" text-anchor="middle">Self-directed • coaching • group support • department sprint</text><path class="line" d="M660,620 L540,620" marker-end="url(#arrow)"/><rect class="box paper" x="40" y="555" width="500" height="130"/><text class="title" x="290.0" y="597" text-anchor="middle">8. Evidence</text><text class="body" x="290.0" y="631" text-anchor="middle">Time • quality • relief/control • reuse • payment intent</text><path class="dash" d="M40,620 H15 V95 H40" marker-end="url(#arrowGold)"/><text class="small" x="28" y="365" text-anchor="middle" transform="rotate(-90 28 365)">Evidence informs the next use case</text></svg>