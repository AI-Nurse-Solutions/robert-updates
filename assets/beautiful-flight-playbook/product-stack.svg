<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.title{font-weight:700;font-size:26px}.body{font-size:19px}.small{font-size:16px}.white{fill:white}.line{stroke:#718096;stroke-width:4;fill:none}.dash{stroke:#b7791f;stroke-width:4;fill:none;stroke-dasharray:12 10}.navy{fill:#10213f;stroke:#10213f}.blue{fill:#eaf5fb;stroke:#1a3158}.mint{fill:#ddf4f1;stroke:#0f766e}.sand{fill:#f5e8cb;stroke:#b7791f}.paper{fill:#fff;stroke:#0f766e}.box{stroke-width:3;rx:24;ry:24}</style><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#718096"/></marker><marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b7791f"/></marker></defs><rect class="box sand" x="180" y="20" width="840" height="95"/><text class="title" x="600.0" y="62" text-anchor="middle">NURSE / CLIENT</text><text class="body" x="600.0" y="96" text-anchor="middle">Purpose • choice • judgment • stop authority</text><path class="line" d="M600,115 L600,140" marker-end="url(#arrow)"/><rect class="box blue" x="180" y="145" width="840" height="95"/><text class="title" x="600.0" y="187" text-anchor="middle">MISSION CONTROL</text><text class="body" x="600.0" y="221" text-anchor="middle">Goals • projects • context • approvals • evidence</text><path class="line" d="M600,240 L600,265" marker-end="url(#arrow)"/><rect class="box mint" x="80" y="270" width="1040" height="95"/><text class="title" x="600.0" y="312" text-anchor="middle">PROFESSIONAL INTELLIGENCE LAYER</text><text class="body" x="600.0" y="346" text-anchor="middle">Role • workflow • standards • boundaries • “what good looks like”</text><path class="line" d="M600,365 L600,390" marker-end="url(#arrow)"/><rect class="box navy" x="180" y="395" width="840" height="95"/><text class="title white" x="600.0" y="437" text-anchor="middle">EDENA GOVERNANCE</text><text class="body white" x="600.0" y="471" text-anchor="middle">Risk • permissions • escalation • refusal • audit</text><path class="line" d="M600,490 L600,515" marker-end="url(#arrow)"/><rect class="box blue" x="180" y="520" width="840" height="115"/><text class="title" x="600.0" y="562" text-anchor="middle">HERMES / ORCHESTRATION SUBSTRATE</text><text class="body" x="600.0" y="596" text-anchor="middle">Memory • routing • tools • task sequence</text><text class="body" x="600.0" y="621" text-anchor="middle">Emerging single-download direction</text><path class="line" d="M600,635 L600,640" marker-end="url(#arrow)"/><rect class="box sand" x="180" y="645" width="840" height="95"/><text class="title" x="600.0" y="687" text-anchor="middle">REPLACEABLE MODELS &amp; TOOLS</text><text class="body" x="600.0" y="721" text-anchor="middle">Local and cloud capabilities selected by task and permission</text><path class="line" d="M600,740 L600,765" marker-end="url(#arrow)"/><rect class="box paper" x="80" y="770" width="1040" height="95"/><text class="title" x="600.0" y="812" text-anchor="middle">ASSURANCE LOOP</text><text class="body" x="600.0" y="846" text-anchor="middle">Sources • evaluation • receipts • human review • learning</text><path class="dash" d="M1120,820 H1170 V70 H1020" marker-end="url(#arrowGold)"/><text class="small" x="1155" y="440" text-anchor="middle" transform="rotate(-90 1155 440)">Learning returns to the person</text></svg>