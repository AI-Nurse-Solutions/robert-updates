<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1090" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.title{font-weight:700;font-size:26px}.body{font-size:19px}.small{font-size:16px}.white{fill:white}.line{stroke:#718096;stroke-width:4;fill:none}.dash{stroke:#b7791f;stroke-width:4;fill:none;stroke-dasharray:12 10}.navy{fill:#10213f;stroke:#10213f}.blue{fill:#eaf5fb;stroke:#1a3158}.mint{fill:#ddf4f1;stroke:#0f766e}.sand{fill:#f5e8cb;stroke:#b7791f}.paper{fill:#fff;stroke:#0f766e}.box{stroke-width:3;rx:24;ry:24}</style><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#718096"/></marker><marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b7791f"/></marker></defs><rect class="box sand" x="360" y="20" width="480" height="90"/><text class="title" x="600.0" y="62" text-anchor="middle">1. HUMAN NEED</text><text class="body" x="600.0" y="96" text-anchor="middle">Pain, aspiration, curiosity or skepticism</text><path class="line" d="M600,110 L600,145" marker-end="url(#arrow)"/><rect class="box blue" x="250" y="150" width="700" height="90"/><text class="title" x="600.0" y="192" text-anchor="middle">2. DISCOVERY</text><text class="body" x="600.0" y="226" text-anchor="middle">90-second videos • referrals • conferences • social posts</text><path class="line" d="M600,240 L600,275" marker-end="url(#arrow)"/><rect class="box navy" x="290" y="280" width="620" height="115"/><text class="title white" x="600.0" y="322" text-anchor="middle">3. TRUST</text><text class="body white" x="600.0" y="356" text-anchor="middle">In Beautiful Flight</text><text class="body white" x="600.0" y="381" text-anchor="middle">Pre-recorded core + live Q&amp;A + stories + demonstrations</text><path class="line" d="M600,395 L600,430" marker-end="url(#arrow)"/><rect class="box mint" x="300" y="435" width="600" height="90"/>